name: ESPHome

on:
  push:
    paths: ["**.yaml", ".github/workflows/esphome.yml"]
  pull_request:
    paths: ["**.yaml", ".github/workflows/esphome.yml"]

permissions:
  contents: read

jobs:
  config:
    name: esphome config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài ESPHome
        run: pip install --quiet esphome==2026.10.2
      - name: Dùng secrets mẫu
        run: cp secrets.template.yaml secrets.yaml
      - name: Kiểm cấu hình
        run: esphome config main.yaml
