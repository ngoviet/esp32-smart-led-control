# ===========================================
# SECRETS TEMPLATE - MẪU FILE BẢO MẬT
# ===========================================
# Chép tệp này thành secrets.yaml rồi điền thông tin thật:
#   Windows:   copy secrets.template.yaml secrets.yaml
#   Linux/Mac: cp secrets.template.yaml secrets.yaml
# secrets.yaml nằm trong .gitignore, không bao giờ được commit.
#
# CI dùng chính tệp mẫu này để chạy `esphome config`, nên mọi khoá mà
# main.yaml gọi bằng !secret đều phải có mặt ở đây với giá trị giả hợp lệ.
# ===========================================

# WiFi. Không ghim BSSID/kênh: bộ phát tự đổi kênh nên kênh ghim cứng dễ lỗi thời.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Mật khẩu cập nhật firmware qua mạng (OTA). Phải trùng với mật khẩu của
# firmware đang chạy trên thiết bị; nếu không nhớ thì nạp lần đầu qua USB.
ota_password: "YOUR_SECURE_OTA_PASSWORD"
