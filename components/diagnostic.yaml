# ===============================================
# DIAGNOSTIC - CHẨN ĐOÁN
# ===============================================
# Chỉ giữ số đo thật. Các chỉ số "ước lượng" trước đây (nhiệt độ CPU và tải
# CPU suy từ RAM trống, dung lượng flash ghi cứng) đã bỏ vì không phản ánh
# thiết bị.
# ===============================================

sensor:
  - platform: wifi_signal
    name: "WiFi RSSI"
    icon: mdi:wifi
    update_interval: 60s
    filters:
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1

  - platform: template
    name: "RAM Free (KB)"
    icon: mdi:chip
    unit_of_measurement: kB
    device_class: data_size
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      return esp_get_free_heap_size() / 1024.0f;

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP"
      icon: mdi:ip-network
    ssid:
      name: "WiFi SSID"
      icon: mdi:wifi
    bssid:
      name: "WiFi BSSID"
      icon: mdi:router-wireless
    mac_address:
      name: "WiFi MAC"
      icon: mdi:lan
