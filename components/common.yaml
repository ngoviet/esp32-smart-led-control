# ===========================================
# CẤU HÌNH CƠ BẢN - COMMON CONFIGURATION
# ===========================================

esphome:
  name: ${device_name}
  min_version: 2026.7.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # Hai tuỳ chọn dưới đây do chính thiết bị gợi ý trong log khởi động
    # (chip ESP32 rev 3.1, bootloader hỗ trợ SRAM1 làm IRAM). Chúng thay đổi
    # cách firmware khởi động, nên chỉ bật khi đang cầm thiết bị và có cáp USB
    # để nạp lại nếu không lên:
    # advanced:
    #   minimum_chip_revision: "3.1"   # firmware nhỏ hơn, KHÔNG chạy trên chip rev cũ
    #   sram1_as_iram: true            # thêm khoảng 40 KB IRAM

# INFO là mức thiết bị đang chạy. Cần xem cấu hình từng linh kiện lúc khởi
# động (dump_config) thì tạm đổi thành DEBUG.
logger:
  level: INFO

api:
  # Mất kết nối Home Assistant không ép khởi động lại: đèn vẫn tự chạy.
  reboot_timeout: 0s

i2c:
  sda: GPIO21
  scl: GPIO22

button:
  - platform: restart
    name: "Restart thiết bị"
